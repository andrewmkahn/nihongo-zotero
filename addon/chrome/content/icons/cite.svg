<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Hanko-style seal: vermilion rounded square with subtle border -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="2.5" ry="2.5"
        fill="#CC2200" stroke="#991800" stroke-width="0.75"/>
  <!-- Character 引 (citation/quote) in white, serif for calligraphic feel -->
  <text x="8" y="12.5"
        font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP','MS Mincho',serif"
        font-size="11.5"
        font-weight="bold"
        text-anchor="middle"
        fill="white">引</text>
</svg>
